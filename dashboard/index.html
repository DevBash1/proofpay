<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProofPay</title>
  <meta name="description" content="Escrow that pays when the work is verified. Live from NEAR testnet.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stripe" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <h1>ProofPay</h1>
      <p class="tagline">Escrow that pays when the work is verified.</p>
    </div>
    <form id="watch" class="watch" autocomplete="off">
      <label for="escrow">Escrow contract on testnet</label>
      <div class="watch-row">
        <input id="escrow" name="escrow" spellcheck="false" placeholder="escrow.example.testnet">
        <button type="submit">Watch</button>
      </div>
      <p id="live" class="live" role="status"></p>
      <p class="hint">Opens on the demo contract. Type any ProofPay escrow contract to watch it. This page only reads from testnet.</p>
    </form>
  </header>
  <nav id="jobs" class="jobs" aria-label="Jobs"></nav>
  <main id="app"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
