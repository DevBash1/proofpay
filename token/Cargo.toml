[package]
name = "proofpay-test-token"
version = "0.1.0"
edition = "2021"
description = "Test stablecoin (tUSD, NEP-141) for ProofPay on NEAR testnet. Not a real stablecoin."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
near-contract-standards = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
